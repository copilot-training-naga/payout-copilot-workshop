name: Deploy workshop companion to Pages

on:
  push:
    branches:
      - main
      - v-nagarajumatta-angular-workshop-site
    paths:
      - "frontend/**"
      - "docs/lab-guide.md"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Build Angular application
        working-directory: frontend
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: npm run build -- --base-href "/${REPOSITORY_NAME}/" --define "__WORKSHOP_SOURCE_REF__=\"${GITHUB_SHA}\""

      - name: Upload Angular site
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/workshop-frontend/browser

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4